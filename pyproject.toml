[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pwlab"
version = "0.1.0"
description = "Probabilistic Password Guessing & Explainable Strength Evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "flask>=3.0.0",
    "zxcvbn>=4.4.28",
    "pytest>=8.0.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
